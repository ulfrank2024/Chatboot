<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceuil - Chatbot du Service de Placement Coop - La Cité</title>
    <link rel="icon" href="/static/image/citelogo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/chatbot.css">
</head>
<body>
    <header>
        <img
            src="/static/image/logocite-removebg-preview.png"
            alt="Logo La Cité"
            class="header-logo"
        />
        <div class="burger" onclick="toggleMenu()">☰</div>
        <nav class="header-nav" id="headerNav">
            <a href="/">Accueil</a>
            <a href="static/pages/pageApropos.html">À propos de nous</a>
        </nav>
    </header>
    <div class="main">
        <button id="coop-info-button">
            <img src="/static/image/citelogo.png" alt="Bouton Chatbot"  class="chatbott">
        </button>
        <div class="chat-container" id="chat-container">
            <div class="chat-header">
                <img src="/static/image/citelogo.png" alt="Logo du chat" class="logochat">
                <span>ChatBot-COOP</span>
                <button id="close-chat-btn">×</button>
            </div>
            <div class="chat-box" id="chat-box">
            </div>
            <div class="chat-suggestions" id="chat-suggestions">
                <button class="suggestion-button" data-question="Comment postuler au COOP ?">Comment postuler au COOP ?</button>
                <button class="suggestion-button" data-question="Quand commence mon stage ?">Quand commence mon stage?</button>
                <button class="suggestion-button" data-question="ou se trouve le service Coop ?">ou se trouve le service Coop?</button>
            </div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Posez votre question...">
                <button id="send-btn">Envoyer</button>
            </div>
        </div>
    </div>
   

    <footer>
        © 2025 La Cité Collégiale<br />
        Tous droits réservés.
    </footer>

    <script src="/static/js/chatbot.js"></script>
    <script src="/static/js/chat-service.js"></script>
    <script src="/static/js/responsive.js"></script>

</body>
</html>
